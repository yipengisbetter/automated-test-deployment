name: Test and Deploy to Vercel

# 触发条件：推送到 main 或 preview 分支 / 合并 PR
on:
  push:
    branches:
      - main
      - preview
  pull_request:
    branches:
      - main
      - preview

jobs:
  # 第一步：运行自动化测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run automated tests 🔥
        run: npm run test  # 测试失败会直接报错，终止流程

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e:serve

  # 第二步：测试通过 → 部署 Vercel
  deploy:
    needs: test  # 👈 必须等 test 成功才执行
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      # 判断分支逻辑
      - name: Deploy Production (main)
        if: github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

      - name: Deploy Preview (preview分支)
        if: github.ref == 'refs/heads/preview'
        run: |
          vercel pull --yes --environment=preview
          vercel build
          vercel deploy --prebuilt
